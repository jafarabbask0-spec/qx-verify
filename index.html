<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex Logo - Platform Icon 5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d121e; /* Quotex trading dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .logo-wrapper {
            width: 350px;
            height: 385px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="logo-wrapper">
        <!-- Embedded platform_icon_5.svg from qx_3.png reference -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
            <g fill="#94002D">
                <!-- Outer Hexagon Left Fragment -->
                <path d="M 220,38 L 84,120 L 84,410 L 250,511 L 250,461 L 126,384 L 126,146 L 220,89 Z" />
                
                <!-- Outer Hexagon Right Fragment -->
                <path d="M 280,38 L 416,120 L 416,410 L 250,511 L 250,461 L 374,384 L 374,146 L 280,89 Z" />
                
                <!-- Central Arrow and Middle Core Pillar -->
                <path d="M 250,10 L 338,76 L 288,76 L 288,435 L 250,460 L 212,435 L 212,76 L 162,76 Z" />
                
                <!-- Inner Left Bar 1 (Shortest - Outer Left) -->
                <path d="M 148,220 L 190,220 L 190,420 L 148,396 Z" />
                
                <!-- Inner Left Bar 2 (Medium - Inner Left) -->
                <path d="M 210,165 L 252,165 L 252,458 L 210,432 Z" />
                
                <!-- Inner Right Bar 3 (Medium - Inner Right) -->
                <path d="M 248,458 L 290,432 L 290,165 L 248,165 Z" />
                
                <!-- Inner Right Bar 4 (Shortest - Outer Right) -->
                <path d="M 310,420 L 352,396 L 352,220 L 310,220 Z" />
            </g>
        </svg>
    </div>

</body>
</html>
